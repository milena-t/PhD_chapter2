
<ideogram>

<spacing>
default = 0.005r
</spacing>

# Ideogram position, fill and outline
radius           = 0.92r
thickness        = 70p #default 20
fill             = yes
stroke_color     = dgrey
stroke_thickness = 2p

chromosomes_display_default = yes
# chromosomes = -1577;-1697;-1282;-1677;-1681;-2782;-2573;-2259;-2280;-2260;-1997;-1125;-1665;-1568;-1088;-1937;-2766;-1634;-2875;-1159;-1410;-2340;-3022;-2773;-1857;-2097;-1619;-2534;-1891;-1652;-1646;-3074;-850;-2073;-1963;-2830;-2245;-1790;-2113;-2791;-2218;-2443;-2166;-2122;-2382;-2707;-2334


# Minimum definition for ideogram labels.

show_label       = yes
# see etc/fonts.conf for list of font names
label_font       = default 
label_radius     = dims(image,radius) - 100p # a higher number puts the label closer to the ideogram band
label_size       = 37  # default was 30
label_parallel   = yes

</ideogram>