
show_ticks          = yes
show_tick_labels    = yes

<ticks>
radius           = 1r
color            = black
thickness        = 2p

# the tick label is derived by multiplying the tick position
# by 'multiplier' and casting it in 'format':
#
# sprintf(format,position*multiplier)
#

multiplier       = 1e-6
chromosomes_units=20_000_000

# %d   - integer
# %f   - float
# %.1f - float with one decimal
# %.2f - float with two decimals
#
# for other formats, see http://perldoc.perl.org/functions/sprintf.html

format           = %d
skip_first_label  = yes
orientation=in

chromosomes_display_default = yes

#chromosomes = -1577;-1697;-1282;-1677;-1681;-2782;-2573;-2259;-2280;-2260;-1997;-1125;-1665;-1568;-1088;-1937;-2766;-1634;-2875;-1159;-1410;-2340;-3022;-2773;-1857;-2097;-1619;-2534;-1891;-1652;-1646;-3074;-850;-2073;-1963;-2830;-2245;-1790;-2113;-2791;-2218;-2443;-2166;-2122;-2382;-2707;-2334

<tick>
# u is specified by chromosomes_units
spacing        = 0.1u # every 1 Mb
size           = 40p

</tick>

<tick>
spacing        = 1u
size           = 30p
show_label     = yes
label_size     = 30p
label_offset   = -10p # how far away are the tick labels from the end of the tick
label_rotate   = no
format         = %d
suffix         = Mb
label_parallel = yes # make tick labels parallel to the ideogram bars
</tick>

</ticks>