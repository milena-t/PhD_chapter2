
# 1.2 IDEOGRAM LABELS, TICKS, AND MODULARIZING CONFIGURATION
#
# In this tutorial, I will add tick marks, tick labels and ideogram
# labels to the previous image. This will require the use of a <ticks>
# block and expanding the <ideogram> block. 
#
# To make the configuration more modular, the tick and ideogram
# parameters will be stored in different files and imported using the
# <<include>> directive.

# ml Perl-bundle-CPAN Circos/0.69-10-GCCcore-13.3.0
# cpanm Clone Config::General Font::TTF::Font Math::Bezier Params::Validate Math::Round List::MoreUtils Readonly Math::VecStat Regexp::Common Text::Format Set::IntSpan SVG Statistics::Basic
# circos -conf /proj/coleoptera-genomics-2025/snic2021-6-30/Milena/chapter2/PhD_chapter2/data/circos/conf_files/circos.conf

karyotype = /proj/coleoptera-genomics-2025/snic2021-6-30/Milena/chapter2/PhD_chapter2/data/circos/C_maculatus_C_maculatus_circos_karyotype.txt

# The chromosomes_unit value is used as a unit (suffix "u") to shorten
# values in other parts of the configuration file. Some parameters,
# such as ideogram and tick spacing, accept "u" suffixes, so instead of
#
# spacing = 10000000
#
# you can write
#
# spacing = 10u
#
# See ticks.conf for examples.

chromosomes_units = 10000000
# chromosomes_scale = /1577,1697,1282,1677,1681,2782,2573,2259,2280,2260,1997,1125,1665,1568,1088,1937,2766,1634,2875,1159,1410,2340,3022,2773,1857,2097,1619,2534,1891,1652,1646,3074,850,2073,1963,2830,2245,1790,2113,2791,2218,2443,2166,2122,2382,2707,2334/=0.5rn


<<include ideogram.conf>>

<<include ticks.conf>>

<links>

<link>
file          = /proj/coleoptera-genomics-2025/snic2021-6-30/Milena/chapter2/PhD_chapter2/data/circos/circos_links_C_maculatus_vs_C_maculatus_Y.txt
color         = black_a5
radius        = 0.89r
bezier_radius = 0.1r #controls the radial position of the control point used to accentuate the curvature in the link
thickness     = 2
</link>

</links>

